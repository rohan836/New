name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload pytest output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.txt

      - name: CLI smoke test
        if: success()
        run: python scripts/solve.py solve examples/smoke_task.json --output-dir runs/ci-smoke
