name: CI Debug

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: |
          set +e
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          status=$?
          echo "PYTEST_STATUS=$status" >> pytest-output.txt
          exit $status
      - name: Upload debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-debug
          path: pytest-output.txt
