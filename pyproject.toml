[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-agi-autonomous-solver"
version = "0.1.0"
description = "Autonomous ARC-AGI research solver with executable program search and verification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
baseline = [
  "numpy>=1.24",
  "numba>=0.57",
  "torch>=2.2",
]
dev = [
  "pytest>=8",
]

[project.scripts]
arc-solver = "autonomous_arc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
